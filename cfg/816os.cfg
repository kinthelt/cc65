# A C program for 816os. The kernel copies the image to $0000 of a free
# bank and starts it at its first byte. Code and data share the bank with
# the C stack, which ends at $DFFF. Like 816os's own cfg/app.cfg, this
# leaves $E000-$FFFF free. ZEROPAGE is the process's own direct page, which
# the kernel places in bank 0.

SYMBOLS {
    __STACKSIZE__: type = weak, value = $0800; # 2k C stack
}

MEMORY {
    ZP:   file = "", define = yes, start = $0000, size = $0100;
    MAIN: file = %O, define = yes, start = $0000, size = $E000 - __STACKSIZE__;
}

SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    STARTUP:  load = MAIN, type = ro;
    LOWCODE:  load = MAIN, type = ro,  optional = yes;
    ONCE:     load = MAIN, type = ro,  optional = yes;
    CODE:     load = MAIN, type = ro;
    RODATA:   load = MAIN, type = ro;
    DATA:     load = MAIN, type = rw;
    INIT:     load = MAIN, type = bss, optional = yes;
    BSS:      load = MAIN, type = bss, define = yes;
}

FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
}
